name: Integration tests (Android emulator)

# Two integration tests (here and in flutter-tests.yml) would double the work
# on every push; a headless emulator is also slower and more fragile than the
# unit/widget job. Run this one manually from the Actions tab, or add a `push`
# trigger below to run it on every push as well.
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # android/gradle.properties sets android.builder.sdkDownload=false, so the
      # runner must already have what the native plugins ask for.
      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Run integration test on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/app_test.dart -d emulator-5554
